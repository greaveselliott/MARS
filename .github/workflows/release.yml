# MarsDocSync:
# docs:
# - docs/design-docs/code-documentation-map.md
# - docs/design-docs/release-versioning.md
# - docs/features/F-009-release-update-lifecycle.md
name: Release

on:
  push:
    tags: ['v*']
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Existing release tag to build assets for, for example v0.14.2
        required: true
        type: string

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.event_name == 'release' && github.event.release.tag_name || github.ref_name }}

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
          - os: ubuntu-latest
            goos: linux
            goarch: arm64
          - os: macos-latest
            goos: darwin
            goarch: amd64
          - os: macos-latest
            goos: darwin
            goarch: arm64
    steps:
      - name: Validate release tag
        run: |
          case "${RELEASE_TAG}" in
            v*) ;;
            *) echo "::error::Release tag must start with v: ${RELEASE_TAG}" && exit 1 ;;
          esac

      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build binary
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          VERSION="${RELEASE_TAG}"
          COMMIT="$(git rev-parse --short=8 HEAD)"
          DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          go build \
            -ldflags "-X main.version=${VERSION} -X main.commit=${COMMIT} -X main.date=${DATE}" \
            -o mars-harness-${GOOS}-${GOARCH} \
            ./cmd/mars-harness

      - name: Generate checksum
        run: |
          asset="mars-harness-${{ matrix.goos }}-${{ matrix.goarch }}"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${asset}" > "${asset}.sha256"
          else
            shasum -a 256 "${asset}" > "${asset}.sha256"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: mars-harness-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            mars-harness-${{ matrix.goos }}-${{ matrix.goarch }}
            mars-harness-${{ matrix.goos }}-${{ matrix.goarch }}.sha256

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Validate release tag
        run: |
          case "${RELEASE_TAG}" in
            v*) ;;
            *) echo "::error::Release tag must start with v: ${RELEASE_TAG}" && exit 1 ;;
          esac

      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect release assets
        run: |
          mkdir -p release
          find artifacts -type f -name 'mars-harness-*' -exec cp {} release/ \;
          cd release
          cat *.sha256 > checksums.txt
          ls -la

      - name: Verify release assets
        run: |
          cd release
          for asset in \
            mars-harness-linux-amd64 \
            mars-harness-linux-arm64 \
            mars-harness-darwin-amd64 \
            mars-harness-darwin-arm64 \
            checksums.txt
          do
            test -s "${asset}"
          done
          sha256sum -c checksums.txt

      - name: Extract changelog release body
        run: |
          version="${RELEASE_TAG#v}"
          awk -v version="${version}" '
            $0 ~ "^## \\[" version "\\]" { capture=1 }
            capture && $0 ~ "^## \\[" && $0 !~ "^## \\[" version "\\]" { exit }
            capture { print }
          ' CHANGELOG.md > release-body.md
          test -s release-body.md

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          tag_name: ${{ env.RELEASE_TAG }}
          body_path: release-body.md
          fail_on_unmatched_files: true
          overwrite_files: true
          files: |
            release/mars-harness-linux-amd64
            release/mars-harness-linux-arm64
            release/mars-harness-darwin-amd64
            release/mars-harness-darwin-arm64
            release/checksums.txt
