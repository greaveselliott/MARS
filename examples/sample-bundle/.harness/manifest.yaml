name: mars
description: Full Mars Harness sample pipeline - strict trunk, 11 explicit roles with canonical domains and modes

roles:
  ceo:
    prompt: roles/ceo-vision.md
    domain: planner
    mode: strategy
    model: reasoning
    schedule: "0 20 * * 0"
    then: [cto-weekly]
    tools: [file_read, file_write, shell_exec, grep, record_decision]

  cto-weekly:
    prompt: roles/cto-harness.md
    domain: planner
    mode: architecture-planning
    model: reasoning
    schedule: "0 21 * * 0"
    then: [coo]
    tools: [file_read, file_write, shell_exec, grep, record_decision]

  coo:
    prompt: roles/coo-tickets.md
    domain: planner
    mode: ticket-breakdown
    model: reasoning
    then: [engineer]
    tools: [file_read, file_write, shell_exec, grep, record_decision, ticket_create]

  engineer:
    prompt: roles/engineer-delivery.md
    domain: engineer
    mode: ticket-delivery
    model: coding
    schedule: "0 0,6,12,18 * * 1-5"
    then: [qa, engineer, dogfood]
    idle_then: [ceo, janitor]
    tools: [file_read, file_write, shell_exec, grep, record_decision]

  qa:
    prompt: roles/qa-health.md
    domain: reviewer
    mode: quality-review
    model: fast
    then: [security]
    tools: [file_read, grep, record_decision]

  security:
    prompt: roles/security-officer.md
    domain: reviewer
    mode: security-review
    model: reasoning
    schedule: "0 22 * * 0"
    then: [dependency-manager]
    tools: [file_read, file_write, shell_exec, grep, record_decision]

  dependency-manager:
    prompt: roles/dependency-manager.md
    domain: maintainer
    mode: dependency-maintenance
    model: fast
    schedule: "0 23 * * 0"
    tools: [file_read, file_write, shell_exec, grep, record_decision]

  release-manager:
    prompt: roles/release-manager.md
    domain: maintainer
    mode: release-management
    model: reasoning
    schedule: "0 8 * * 1"
    tools: [file_read, file_write, shell_exec, grep, record_decision]

  dogfood:
    prompt: roles/dogfood-tester.md
    domain: end-to-end-tester
    mode: dogfood-validation
    model: coding
    schedule: "0 10 * * 1-5"
    max_turns: 40
    tools: [file_read, file_write, shell_exec, grep, record_decision, ticket_create]

  pipeline-fixer:
    prompt: roles/pipeline-fixer.md
    domain: engineer
    mode: pipeline-repair
    model: coding
    triggers:
      - workflow_run.conclusion == "failure"
    then: [qa]
    tools: [file_read, file_write, shell_exec, grep, record_decision]

  janitor:
    prompt: roles/janitor.md
    domain: orchestrator
    mode: ticket-hygiene
    model: fast
    schedule: "0 7 * * *"
    max_turns: 30
    tools: [file_read, file_write, shell_exec, grep, record_decision]
