description: Eleven MARS example automation roles

roles:
  engineer:
    prompt: roles/engineer.md
    tools:
      - file_read
      - file_write
      - shell_exec
      - grep
    triggers:
      - ticket.assigned
    tier: autonomous
    model: ""

  pipeline-fixer:
    prompt: roles/pipeline-fixer.md
    tools:
      - file_read
      - file_write
      - shell_exec
      - grep
    triggers:
      - workflow_run.conclusion == "failure"
    tier: autonomous
    model: ""

  qa:
    prompt: roles/qa.md
    tools:
      - file_read
      - file_write
      - shell_exec
      - grep
    triggers:
      - schedule.weekly
      - workflow_dispatch
    tier: autonomous
    model: ""

  code-reviewer:
    prompt: roles/code-reviewer.md
    tools:
      - file_read
      - grep
    triggers:
      - commit.pushed
      - workflow_dispatch
    tier: supervised
    model: ""

  release-manager:
    prompt: roles/release-manager.md
    tools:
      - file_read
      - file_write
      - shell_exec
      - grep
