<!DOCTYPE html>
<!--
MarsDocSync:
docs:
- docs/design-docs/code-documentation-map.md
- docs/design-docs/dashboard.md
- docs/features/F-010-dashboard-control-plane.md
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{.Title}} — Mars Harness</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="https://unpkg.com/htmx.org@2.0.4"></script>
</head>
<body>
  <nav class="sidebar">
    <div class="logo">Mars Harness</div>
    <a href="/orchestration" class="nav-item{{if eq .ActiveNav "orchestration"}} active{{end}}">Orchestration</a>
    <a href="/pipeline" class="nav-item{{if eq .ActiveNav "pipeline"}} active{{end}}">Pipeline</a>
    <a href="/roles" class="nav-item{{if eq .ActiveNav "roles"}} active{{end}}">Roles</a>
    <a href="/throughput" class="nav-item{{if eq .ActiveNav "throughput"}} active{{end}}">Throughput</a>
    <a href="/debug" class="nav-item{{if eq .ActiveNav "debug"}} active{{end}}">Debug</a>
    <a href="/evolution" class="nav-item{{if eq .ActiveNav "evolution"}} active{{end}}">Evolution</a>
    <div class="nav-spacer"></div>
    <button id="estop-btn" class="estop-btn" onclick="emergencyStop()">Emergency Stop</button>
  </nav>

  <main class="content">
    <header class="page-header">
      <h1>Role Health</h1>
      <span class="timestamp">{{.Now}}</span>
    </header>

    <div class="card">
      <div class="card-heading">
        <h2>Active Roles</h2>
        <a class="doc-link" href="/api/quality-score" target="_blank" rel="noreferrer">docs/QUALITY_SCORE.md</a>
      </div>
      <div id="role-grid" class="role-grid">
        <p class="muted">Loading&hellip;</p>
      </div>
    </div>
  </main>

  <script src="/static/app.js"></script>
  <script>
  (function() {
    function loadRolesData() {
      fetch("/api/roles")
        .then(function(r) { return r.json(); })
        .then(function(data) { renderRoles(data.roles || []); })
        .catch(function(err) { console.error("Failed to load roles:", err); });
    }

    function renderRoles(roles) {
      var grid = document.getElementById("role-grid");
      if (roles.length === 0) {
        grid.innerHTML = '<p class="muted">No role data yet — run some jobs first</p>';
        return;
      }

      grid.innerHTML = "";
      roles.forEach(function(role) {
        var card = document.createElement("div");
        card.id = "role-" + role.role;
        var scoreClass = role.score >= 0.8 ? "success" : role.score >= 0.5 ? "warning" : "error";
        var scorePercent = Math.round(role.score * 100);

        card.className = "role-card " + scoreClass;
        card.innerHTML =
          '<div class="role-name">' + esc(role.role) + '</div>' +
          '<div class="role-score">' +
            '<div class="score-bar"><div class="score-fill ' + scoreClass + '" style="width:' + scorePercent + '%"></div></div>' +
            '<span>' + scorePercent + '%</span>' +
          '</div>' +
          '<div class="role-stats">' +
            '<span class="stat-success">' + role.success_count + ' passed</span>' +
            '<span class="stat-fail">' + role.fail_count + ' failed</span>' +
            '<span class="stat-total">' + role.sample_size + ' total</span>' +
          '</div>' +
          '<div class="role-status">idle</div>';

        grid.appendChild(card);
      });
    }

    function esc(str) {
      var div = document.createElement("div");
      div.textContent = str || "";
      return div.innerHTML;
    }

    loadRolesData();
    setInterval(loadRolesData, 30000);
  })();
  </script>
</body>
</html>
