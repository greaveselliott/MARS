<!DOCTYPE html>
<!--
MarsDocSync:
docs:
- docs/design-docs/code-documentation-map.md
- docs/design-docs/dashboard.md
- docs/features/F-010-dashboard-control-plane.md
- docs/features/F-017-open-source-publication.md
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="htmx-config" content='{"allowEval":false,"allowScriptTags":false,"includeIndicatorStyles":false,"defaultSwapStyle":"textContent"}'>
  <title>{{.Title}} — MARS</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/vendor/htmx-2.0.4.min.js" defer></script>
</head>
<body>
  <nav class="sidebar">
    <div class="logo">MARS</div>
    <a href="/orchestration" class="nav-item{{if eq .ActiveNav "orchestration"}} active{{end}}">Orchestration</a>
    <a href="/pipeline" class="nav-item{{if eq .ActiveNav "pipeline"}} active{{end}}">Pipeline</a>
    <a href="/roles" class="nav-item{{if eq .ActiveNav "roles"}} active{{end}}">Roles</a>
    <a href="/throughput" class="nav-item{{if eq .ActiveNav "throughput"}} active{{end}}">Throughput</a>
    <a href="/debug" class="nav-item{{if eq .ActiveNav "debug"}} active{{end}}">Debug</a>
    <a href="/evolution" class="nav-item{{if eq .ActiveNav "evolution"}} active{{end}}">Evolution</a>
    <div class="nav-spacer"></div>
    <button id="estop-btn" class="estop-btn" type="button">Emergency Stop</button>
  </nav>

  <main class="content">
    <header class="page-header">
      <h1>Debug</h1>
      <span class="timestamp">{{.Now}}</span>
    </header>

    <div class="card">
      <h2>Raw Event Stream</h2>
      <pre id="debug-log" class="debug-log"></pre>
    </div>
  </main>

  <script src="/static/app.js" defer></script>
</body>
</html>
