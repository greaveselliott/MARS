{{define "base"}}<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{.Title}} — Mars Harness</title>
    <link rel="stylesheet" href="/static/app.css">
    <script src="https://unpkg.com/htmx.org@2.0.4" defer></script>
    <script src="https://unpkg.com/htmx-ext-sse@2.3.0/sse.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js" defer></script>
</head>
<body hx-ext="sse" sse-connect="/api/events">
    <nav class="sidebar">
        <div class="sidebar-header">
            <h1>Mars Harness</h1>
        </div>
        <ul class="nav-list">
            <li><a href="/pipeline" class="nav-link{{if eq .ActiveNav "pipeline"}} active{{end}}">Pipeline Flow</a></li>
            <li><a href="/roles" class="nav-link{{if eq .ActiveNav "roles"}} active{{end}}">Role Health</a></li>
            <li><a href="/throughput" class="nav-link{{if eq .ActiveNav "throughput"}} active{{end}}">Throughput</a></li>
            <li><a href="/debug" class="nav-link{{if eq .ActiveNav "debug"}} active{{end}}">Debug</a></li>
            <li><a href="/evolution" class="nav-link{{if eq .ActiveNav "evolution"}} active{{end}}">Evolution</a></li>
        </ul>
        <div class="sidebar-footer">
            <button id="emergency-stop-btn" class="btn-danger" onclick="confirmEmergencyStop()">Emergency Stop</button>
        </div>
    </nav>
    <main class="content">
        <header class="page-header">
            <h2>{{.Title}}</h2>
            <span class="timestamp">{{.Now}}</span>
        </header>
        {{block "page-content" .}}{{end}}
    </main>
    <script src="/static/app.js"></script>
</body>
</html>{{end}}
