<!DOCTYPE html>
<!--
MarsDocSync:
docs:
- docs/design-docs/code-documentation-map.md
- docs/design-docs/dashboard.md
- docs/features/F-010-dashboard-control-plane.md
- docs/features/F-017-open-source-publication.md
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="htmx-config" content='{"allowEval":false,"allowScriptTags":false,"includeIndicatorStyles":false,"defaultSwapStyle":"textContent"}'>
  <title>{{.Title}} — MARS</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/vendor/htmx-2.0.4.min.js" defer></script>
  <script src="/static/app.js" defer></script>
</head>
<body>
  <nav class="sidebar">
    <div class="logo">MARS</div>
    <a href="/orchestration" class="nav-item{{if eq .ActiveNav "orchestration"}} active{{end}}">Orchestration</a>
    <a href="/pipeline" class="nav-item{{if eq .ActiveNav "pipeline"}} active{{end}}">Pipeline</a>
    <a href="/roles" class="nav-item{{if eq .ActiveNav "roles"}} active{{end}}">Roles</a>
    <a href="/throughput" class="nav-item{{if eq .ActiveNav "throughput"}} active{{end}}">Throughput</a>
    <a href="/debug" class="nav-item{{if eq .ActiveNav "debug"}} active{{end}}">Debug</a>
    <a href="/evolution" class="nav-item{{if eq .ActiveNav "evolution"}} active{{end}}">Evolution</a>
    <div class="nav-spacer"></div>
    <div class="control-bar" id="control-bar">
      <div class="status-indicator"><span class="status-dot" id="status-dot"></span><span id="status-label">Running</span><span id="active-jobs" class="active-jobs"></span></div>
      <button class="ctrl-btn" id="btn-pause" type="button"><span class="key-hint">P</span><span id="pause-label">Pause</span></button>
      <button class="ctrl-btn warn" id="btn-restart" type="button"><span class="key-hint">R</span>Restart</button>
      <div class="ctrl-group"><select class="ctrl-select" id="select-repo"><option value="">Repo…</option></select><button class="ctrl-btn" id="btn-scan" type="button"><span class="key-hint">S</span>Scan</button></div>
      <div class="ctrl-group"><select class="ctrl-select" id="select-role"><option value="">Role…</option></select><button class="ctrl-btn" id="btn-run" type="button">Run</button></div>
      <button class="ctrl-btn danger" id="btn-stop" type="button"><span class="key-hint">Q</span>Stop</button>
    </div>
    <button id="estop-btn" class="estop-btn" type="button">Emergency Stop</button>
  </nav>
  <main class="content">
    <header class="page-header"><h1>Orchestration</h1><span class="timestamp">{{.Now}}</span></header>
    <div class="card"><h2>Repository Modes</h2><div id="orchestration-repos"><p class="muted">Loading…</p></div></div>
    <div class="card"><h2>Dispatch Model</h2><div id="dispatch-model"><p class="muted">Loading…</p></div></div>
    <div class="card-row"><div class="card half"><h2>Recent Dispositions</h2><div id="disposition-list"><p class="muted">Loading…</p></div></div><div class="card half"><h2>Recent Decisions</h2><div id="decision-list"><p class="muted">Loading…</p></div></div></div>
  </main>
</body>
</html>
