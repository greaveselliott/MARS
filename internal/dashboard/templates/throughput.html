<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{.Title}} — Mars Harness</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="https://unpkg.com/htmx.org@2.0.4"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
</head>
<body>
  <nav class="sidebar">
    <div class="logo">Mars Harness</div>
    <a href="/pipeline" class="nav-item{{if eq .ActiveNav "pipeline"}} active{{end}}">Pipeline</a>
    <a href="/roles" class="nav-item{{if eq .ActiveNav "roles"}} active{{end}}">Roles</a>
    <a href="/throughput" class="nav-item{{if eq .ActiveNav "throughput"}} active{{end}}">Throughput</a>
    <a href="/debug" class="nav-item{{if eq .ActiveNav "debug"}} active{{end}}">Debug</a>
    <a href="/evolution" class="nav-item{{if eq .ActiveNav "evolution"}} active{{end}}">Evolution</a>
    <div class="nav-spacer"></div>
    <button id="estop-btn" class="estop-btn" onclick="emergencyStop()">Emergency Stop</button>
  </nav>

  <main class="content">
    <header class="page-header">
      <h1>Throughput</h1>
      <span class="timestamp">{{.Now}}</span>
    </header>

    <div class="card">
      <h2>Jobs Over Time</h2>
      <canvas id="throughput-chart" height="300"></canvas>
    </div>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
